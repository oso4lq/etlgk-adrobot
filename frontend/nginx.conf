server {
    listen 80;
    root /usr/share/nginx/html;

    # Встроенный DNS Docker: имя бэкенда определяется при каждом запросе (кэш 10 с), а не один раз
    # при старте nginx. Иначе nginx не стартует без бэкенда и не видит его новый адрес после перезапуска.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # Адрес в переменной без пути: nginx передаёт бэкенду исходный URI запроса без изменений
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Остановленный бэкенд должен давать 502 за секунды, а не ждать системного таймаута соединения
        proxy_connect_timeout 5s;
        # Один запрос приложения делает несколько обращений к Keitaro (Push — три, создание кампании — три
        # записи и возможная компенсация), у каждого свой таймаут и повторы в бэкенде. 300 с — запас-страховка
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
